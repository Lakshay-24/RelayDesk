name: RelayDesk CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://atuvyeoctkevglimkmka.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
      RELAYDESK_E2E_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Verify agent release manifest
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const root = path.join(process.cwd(), 'public', 'agent-dist');
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest.json'), 'utf8'));
          if (!/^[0-9]+[.][0-9]+[.][0-9]+$/.test(String(manifest.version || ''))) throw new Error('invalid manifest version');
          const listed = Object.keys(manifest.files || {}).sort();
          const expected = ['config.js','credentials.js','index.js','package.json','pair.js','service.js'].sort();
          if (JSON.stringify(listed) !== JSON.stringify(expected)) throw new Error('manifest file set mismatch');
          for (const name of listed) {
            const file = path.join(root, name);
            if (!fs.existsSync(file)) throw new Error('missing release file: ' + name);
            const actual = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            if (actual !== manifest.files[name]) throw new Error('checksum mismatch for ' + name);
          }
          const launcher = path.join(root, 'launcher.js');
          if (!/^[a-f0-9]{64}$/.test(String(manifest.launcher_sha256 || ''))) throw new Error('invalid launcher checksum');
          const launcherActual = crypto.createHash('sha256').update(fs.readFileSync(launcher)).digest('hex');
          if (launcherActual !== manifest.launcher_sha256) throw new Error('launcher checksum mismatch');
          if (fs.existsSync(path.join(root, 'update.js'))) throw new Error('obsolete in-place updater must not be published');
          console.log('agent manifest and launcher verified:', manifest.version);
          NODE
      - name: Agent script syntax
        run: |
          node --check public/agent-dist/launcher.js
          node --check public/agent-dist/index.js
          node --check public/agent-dist/service.js
          node --check public/agent-dist/pair.js
          bash -n public/install.sh
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Production smoke
        run: npm run smoke
      - name: Branch browser E2E
        env:
          RELAYDESK_E2E_LOCAL: "1"
          RELAYDESK_BASE_URL: http://127.0.0.1:3000
        run: npm run e2e
