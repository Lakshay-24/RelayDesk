name: RelayDesk CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://atuvyeoctkevglimkmka.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
      RELAYDESK_E2E_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Production smoke
        run: npm run smoke
      - name: Branch browser E2E
        env:
          RELAYDESK_E2E_LOCAL: "1"
          RELAYDESK_BASE_URL: http://127.0.0.1:3000
        run: npm run e2e
