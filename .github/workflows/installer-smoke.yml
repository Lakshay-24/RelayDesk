name: RelayDesk installer smoke

on:
  pull_request:
    paths:
      - "public/install.sh"
      - "public/install.ps1"
      - "public/agent-dist/**"
      - ".github/workflows/installer-smoke.yml"
  workflow_dispatch:

jobs:
  unix-installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Serve branch agent bundle
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public/agent-dist > /tmp/relaydesk-bundle.log 2>&1 &
          echo $! > /tmp/relaydesk-bundle.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8765/manifest.json >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Run installer without pairing or service
        env:
          RELAYDESK_DOWNLOAD_BASE: http://127.0.0.1:8765
          RELAYDESK_INSTALL_ROOT: ${{ runner.temp }}/relaydesk-install
          RELAYDESK_SKIP_PAIR: "1"
          RELAYDESK_SKIP_SERVICE: "1"
        run: bash public/install.sh
      - name: Verify versioned install layout
        env:
          RELAYDESK_INSTALL_ROOT: ${{ runner.temp }}/relaydesk-install
        run: |
          test -f "$RELAYDESK_INSTALL_ROOT/agent/launcher.js"
          test -f "$RELAYDESK_INSTALL_ROOT/agent/current.json"
          version="$(node -e "const f=require('fs');const p=process.argv[1];process.stdout.write(JSON.parse(f.readFileSync(p,'utf8')).version)" "$RELAYDESK_INSTALL_ROOT/agent/current.json")"
          test -n "$version"
          test -f "$RELAYDESK_INSTALL_ROOT/agent/releases/$version/dist/index.js"
          test -f "$RELAYDESK_INSTALL_ROOT/agent/releases/$version/dist/manifest.json"
          test -d "$RELAYDESK_INSTALL_ROOT/agent/releases/$version/node_modules"

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Serve branch agent bundle
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList @("-m","http.server","8765","--bind","127.0.0.1","--directory","public/agent-dist") -PassThru -WindowStyle Hidden
          $server.Id | Set-Content "$env:RUNNER_TEMP\relaydesk-http.pid"
          for ($i=0; $i -lt 20; $i++) {
            try {
              Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8765/manifest.json" | Out-Null
              exit 0
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          exit 1
      - name: Run Windows installer without pairing or service
        shell: powershell
        run: |
          & .\public\install.ps1 -BaseUrl "http://127.0.0.1:8765" -InstallRoot "$env:RUNNER_TEMP\relaydesk-install" -SkipPair -SkipService
      - name: Verify Windows versioned install layout and JSON encoding
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\relaydesk-install"
          if (!(Test-Path "$root\agent\launcher.js")) { throw "launcher missing" }
          if (!(Test-Path "$root\agent\current.json")) { throw "current.json missing" }
          $bytes = [System.IO.File]::ReadAllBytes("$root\agent\current.json")
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) { throw "current.json contains UTF-8 BOM" }
          $current = Get-Content "$root\agent\current.json" -Raw | ConvertFrom-Json
          $version = [string]$current.version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "version missing" }
          if (!(Test-Path "$root\agent\releases\$version\dist\index.js")) { throw "release index missing" }
          if (!(Test-Path "$root\agent\releases\$version\dist\manifest.json")) { throw "release manifest missing" }
          if (!(Test-Path "$root\agent\releases\$version\node_modules")) { throw "release node_modules missing" }
